<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saidu Bello — Platform, DevOps, Systems. I build the infrastructure AI agents run on.">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    .spin-a { transform-origin: 968px 150px; animation: spin 46s linear infinite; }
    .spin-b { transform-origin: 968px 150px; animation: spin 70s linear infinite reverse; }
    .spin-c { transform-origin: 968px 150px; animation: spin 100s linear infinite; }
    .pulse { animation: pulse 3.4s ease-in-out infinite; }
    .pulse-late { animation: pulse 3.4s ease-in-out 1.7s infinite; }
    .sweep { animation: sweep 4.6s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes sweep { 0%, 100% { width: 96px; } 50% { width: 210px; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#131F38" stroke-width="1" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="#0A0F1E"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- orbital motif -->
    <g class="spin-a" stroke="#1B2B4A" fill="none">
      <circle cx="968" cy="150" r="64"/>
      <circle cx="1032" cy="150" r="4.5" fill="#38BDF8" stroke="none" class="pulse"/>
    </g>
    <g class="spin-b" stroke="#182642" fill="none">
      <circle cx="968" cy="150" r="102"/>
      <circle cx="968" cy="48" r="3.5" fill="#818CF8" stroke="none" class="pulse-late"/>
      <circle cx="866" cy="150" r="3" fill="#38BDF8" stroke="none"/>
    </g>
    <g class="spin-c" stroke="#152138" fill="none">
      <circle cx="968" cy="150" r="138"/>
      <circle cx="1106" cy="150" r="3" fill="#64748B" stroke="none" class="pulse"/>
    </g>
    <circle cx="968" cy="150" r="7" fill="#38BDF8"/>
    <circle cx="968" cy="150" r="16" stroke="#38BDF8" stroke-opacity="0.25" fill="none"/>

    <!-- copy -->
    <text x="72" y="104" fill="#38BDF8" font-size="14" font-weight="600" letter-spacing="7" class="mono">PLATFORM &#183; DEVOPS &#183; SYSTEMS</text>
    <text x="70" y="172" fill="#F8FAFC" font-size="62" font-weight="800" letter-spacing="-1">Saidu Bello</text>
    <rect x="72" y="194" width="120" height="4" rx="2" fill="url(#accent)" class="sweep"/>
    <text x="72" y="238" fill="#94A3B8" font-size="20">
      <tspan class="mono" fill="#475569">$</tspan>
      <tspan dx="6">I build the infrastructure AI agents run on</tspan>
      <tspan dx="4" fill="#38BDF8" class="cursor">&#9613;</tspan>
    </text>
  </g>
</svg>
